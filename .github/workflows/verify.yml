name: Verify analysis
on: [push, pull_request]
jobs:
  offline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m unittest discover -s tests -v
      - run: python scripts/extract_table.py
      - run: python scripts/analyze.py
      - run: python scripts/import_dryad.py
      - run: python scripts/build_manuscript.py
      - run: git diff --exit-code -- data/processed results/summary.json results/isotherm_summary.json paper/manuscript.tex
